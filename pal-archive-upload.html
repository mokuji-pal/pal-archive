    <title>PAL ARCHIVE リンク版</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a1626;
        --surface: #101f36;
        --surface2: #16294a;
        --surface3: #1d3460;
        --text: #e8f1f8;
        --dim: #8fa6bd;
        --border: #22385c;
        --accent: #2dd4bf;
        --accent-ink: #06281f;
        --warn: #f5b942;
        --danger: #f87171;
        --danger-bg: #5a2323;
        --radius: 14px;
      }
      * { box-sizing: border-box; }
      html { background: var(--bg); }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
        -webkit-tap-highlight-color: transparent;
        padding-bottom: calc(76px + env(safe-area-inset-bottom));
      }
      .tnum { font-variant-numeric: tabular-nums; }
      button, input, select, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }
      .wrap { max-width: 1080px; margin: 0 auto; padding: 14px calc(14px + env(safe-area-inset-right, 0px)) 24px calc(14px + env(safe-area-inset-left, 0px)); }
      .topbar {
        display: flex; align-items: center; gap: 10px;
        padding: calc(10px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-right, 0px)) 0 calc(14px + env(safe-area-inset-left, 0px));
        max-width: 1080px; margin: 0 auto;
      }
      .topbar .ttl { font-size: 15px; font-weight: 800; letter-spacing: .04em; }
      .topbar .ttl small { color: var(--accent); font-size: 11px; font-weight: 700; margin-left: 6px; letter-spacing: .08em; }
      .store-badge { margin-left: auto; font-size: 11px; color: var(--dim); display: inline-flex; align-items: center; gap: 5px; }
      .store-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
      .store-badge.bad .dot { background: var(--danger); }
      h2.sec { font-size: 16px; margin: 18px 0 8px; }
      h2.sec:first-child { margin-top: 4px; }
      .dim { color: var(--dim); }
      .small { font-size: 12px; }
      /* inputs */
      .inp, .sel, .ta {
        width: 100%; background: var(--surface2); border: 1px solid var(--border);
        border-radius: 10px; padding: 10px 12px; font-size: 15px; outline: none;
      }
      .inp:focus, .sel:focus, .ta:focus { border-color: var(--accent); }
      .sel { appearance: auto; }
      .lbl { display: block; font-size: 12px; color: var(--dim); margin: 0 0 5px; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        border: 1px solid var(--border); background: var(--surface2); color: var(--text);
        border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 600; min-height: 42px;
      }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 800; }
      .btn.danger { background: var(--danger-bg); border-color: #7a3232; color: #ffb4b4; }
      .btn.ghost { background: transparent; }
      .btn.sm { min-height: 34px; padding: 5px 10px; font-size: 13px; border-radius: 8px; }

});

var LS_KEY = "pal-archive-link:v1";
var LS_UI_KEY = "pal-archive-link:ui";
var storageOK = true;
var memFallback = null;
function lsGet(key){
  try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }
  catch(e){ storageOK = false; return key === LS_KEY ? memFallback : null; }
}
function lsSet(key, val){
  if (key === LS_KEY) memFallback = val;
  try { localStorage.setItem(key, JSON.stringify(val)); }
  catch(e){ storageOK = false; showStoreBadge(); toast("端末への保存に失敗しました。容量不足の可能性があります。JSONバックアップを書き出してください"); }
}
function showStoreBadge(){
  var b = document.getElementById("storeBadge");
  if (!b) return;
  if (!storageOK){ b.classList.add("bad"); document.getElementById("storeBadgeText").textContent = "保存不可（メモリのみ）"; }
}
function uid(){ return "id" + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36); }
function nowISO(){ return new Date().toISOString(); }

function defaultDB(){
  return {
    version: 1,
    bases: SEED_BASES.map(function(b){ return { id: uid() + Math.floor(Math.random()*1e4), name: b.name, memo: b.memo || "" }; }),
    individuals: [],
    customPals: [],      /* 追加したパル（シード形式） */
    palEdits: {},        /* シードパルの編集上書き {名前: パル} */
    palDeleted: [],      /* 削除したシードパルの名前 */
    customPassives: [],  /* 追加したパッシブ */
    passiveEdits: {},    /* シードパッシブの編集上書き {名前: パッシブ} */
    passiveDeleted: []
  };
}
var DB = lsGet(LS_KEY);
if (!DB || typeof DB !== "object" || !Array.isArray(DB.individuals)) { DB = defaultDB(); lsSet(LS_KEY, DB); }
["bases","individuals","customPals","palDeleted","customPassives","passiveDeleted"].forEach(function(k){ if (!Array.isArray(DB[k])) DB[k] = []; });
["palEdits","passiveEdits"].forEach(function(k){ if (!DB[k] || typeof DB[k] !== "object") DB[k] = {}; });
function save(){ lsSet(LS_KEY, DB); }

/* ================= カタログ（実効データ） ================= */
function allPals(){
  var out = [], seen = {};
  SEED_PALS.forEach(function(p){
    if (DB.palDeleted.indexOf(p.name) >= 0) return;
    var e = DB.palEdits[p.name];
    out.push(e ? Object.assign({}, e, { custom: false }) : p); seen[p.name] = 1;
  });
  DB.customPals.forEach(function(p){ if (!seen[p.name]) { out.push(Object.assign({}, p, { custom: true })); seen[p.name] = 1; } });
  return out;
}
function allPassives(){
  var out = [], seen = {};
  SEED_PASSIVES.forEach(function(p){
    if (DB.passiveDeleted.indexOf(p.name) >= 0) return;
    var e = DB.passiveEdits[p.name];
    out.push(e ? Object.assign({}, e, { custom: false }) : p); seen[p.name] = 1;
  });
  DB.customPassives.forEach(function(p){ if (!seen[p.name]) { out.push(Object.assign({}, p, { custom: true })); seen[p.name] = 1; } });
  return out;
}
function palByName(name){ var l = allPals(); for (var i=0;i<l.length;i++) if (l[i].name === name) return l[i]; return null; }
/* 用途マッチ：パートナーの用途タグに加え、タグと同名の作業適性を持つパルも対象にする

function palMatchesUse(p, tag){
  if (p.partner && p.partner.tags.indexOf(tag) >= 0) return true;
  if (WORK_TYPES.indexOf(tag) >= 0 && (p.work[tag] || 0) >= 1) return true;

function baseName(id){ var b = id ? baseById(id) : null; return b ? b.name : "未配置"; }

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];

function missingPassives(ind){ return (ind.targetPassives||[]).filter(function(t){ return (ind.currentPassives||[]).indexOf(t) < 0; }); }
function completion(ind){
  var t = ind.targetPassives || [];
  if (!t.length) return ind.status === "完成" ? 100 : 0;

    if (f.base !== "all"){

function sortPals(list, sort){
  var byDex = function(a,b){ return String(a.dexNo).localeCompare(String(b.dexNo), "ja", { numeric: true }) || a.name.localeCompare(b.name, "ja"); };
  var byStat = function(key){
    return function(a,b){
      var va = a[key] == null ? -1 : a[key], vb = b[key] == null ? -1 : b[key];
      return vb - va || byDex(a, b);
    };
  };
  if (sort === "name") list.sort(function(a,b){ return a.name.localeCompare(b.name, "ja") || byDex(a, b); });
  else if (sort === "hp") list.sort(byStat("hp"));
  else if (sort === "atk") list.sort(byStat("atk"));
  else if (sort === "def") list.sort(byStat("def"));
  else if (sort === "total") list.sort(function(a,b){
    var va = (a.hp == null && a.atk == null && a.def == null) ? -1 : palTotal(a);
    var vb = (b.hp == null && b.atk == null && b.def == null) ? -1 : palTotal(b);
    return vb - va || byDex(a, b);
  });
  else list.sort(byDex);
  return list;
}
function filteredDex(){
  var f = F.dex, q = f.q.trim();
  var list = allPals().filter(function(p){
    if (q && !p.name.includes(q)) return false;
    if (f.element !== "all" && p.elements.indexOf(f.element) < 0) return false;
    if (f.work1 !== "all" && (p.work[f.work1]||0) < f.work1Min) return false;
    if (f.work2 !== "all" && (p.work[f.work2]||0) < 1) return false;
    if (f.tag !== "all" && !palMatchesUse(p, f.tag)) return false;
    if (f.role === "base" && !Object.keys(p.work).length) return false;
    if (f.role === "battle" && palTotal(p) < 260) return false;
    return true;
  });
  return sortPals(list, f.sort || "dex");
}

/* ================= パートナースキル図鑑 ================= */
function viewPartner(){
  var f = F.par;
  var withP = allPals().filter(function(p){ return p.partner; });
  var q = f.q.trim();
  var terms = q ? [q].concat(PARTNER_SYNONYMS[q] || []) : [];
  var list = withP.filter(function(p){
    if (f.tag !== "all" && !palMatchesUse(p, f.tag)) return false;
    if (!terms.length) return true;
    return terms.some(function(t){
      return p.name.includes(t) || p.partner.name.includes(t) || p.partner.desc.includes(t) ||
        p.partner.tags.some(function(x){ return x.includes(t); }) ||
        Object.keys(p.work).some(function(w){ return w.includes(t); });
    });
  }).sort(function(a,b){ return String(a.dexNo).localeCompare(String(b.dexNo), "ja", { numeric: true }); });
  var h = '<h2 class="sec">パートナースキル図鑑 <span class="small dim tnum">収録' + withP.length + '件</span></h2>';
  h += '<div class="filters"><div class="frow"><input class="inp" data-f="par.q" placeholder="用途・効果・スキル名・パル名で検索（例：農業、牧場、重量）" value="' + esc(f.q) + '" aria-label="パートナースキルを検索" /></div>';
  h += '<div class="chiprow"><button type="button" class="chip' + (f.tag==="all"?" on":"") + '" data-act="par-tag" data-tag="all">すべて</button>' +
    PARTNER_TAGS.map(function(t){ return '<button type="button" class="chip' + (f.tag===t?" on":"") + '" data-act="par-tag" data-tag="' + t + '">' + t + "</button>"; }).join("") + "</div>";
  h += '<div class="small dim">用途タグと効果文の両方から逆引きできます。「農業」と検索すると種まき・水やり・採集・牧場関連もヒットします。' + list.length + "件表示</div></div>";
  if (!list.length) h += '<div class="empty">条件に合うパートナースキルがありません</div>';
  else h += '<div class="grid">' + list.map(function(p){
    return '<div class="card" data-act="par-detail" data-name="' + esc(p.name) + '" role="button" tabindex="0" style="cursor:pointer"><div style="display:flex;gap:10px;align-items:flex-start">' + avatarHTML(p, null, 44) +

  }).join("") + "</div>";

function viewBases(){
  var f = F.base;

    PURPOSES.map(function(p){ return '<option value="' + p + '"' + (f.purpose===p?" selected":"") + ">" + p + "</option>"; }).join("") + "</select></div></div>";
  var sections = DB.bases.filter(function(b){ return b.name !== "未配置"; }).map(function(b){ return { base: b, id: b.id }; });
  sections.push({ base: null, id: null });

    var placed = DB.individuals.filter(function(i){ return (i.baseId || null) === sec.id; });

        '<div style="flex:1;min-width:0"><span style="font-weight:700">' + esc(i.palName) + (i.nickname ? ' <span style="color:var(--accent)">「' + esc(i.nickname) + "」</span>" : "") + '</span> <span class="statusbadge">' + esc(i.status) + '</span><div class="small dim">' + (kind === "planned" ? "配置予定" : "配置中") + "　用途：" + esc((i.purposes||[]).join("・") || "未設定") + "</div></div>" +
        '<span class="small dim tnum">完成度' + completion(i) + "%</span></div></div>";
    };

      ' <span class="small dim tnum">配置中' + placed.length + "匹" + (planned.length ? " / 予定" + planned.length + "匹" : "") + "</span></h3>";

    out += "</div>";

    var rows = placed.filter(match).map(function(i){ return row(i, "placed"); }).concat(planned.filter(match).map(function(i){ return row(i, "planned"); }));
    out += '<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">' + (rows.length ? rows.join("") : '<p class="small dim" style="margin:0">該当する個体はいません</p>') + "</div></section>";

}

/* ================= モーダル管理 ================= */
var modalRoot = document.getElementById("modalRoot");
function openModal(html, wide){
  var layer = document.createElement("div");
  layer.className = "modalwrap";
  layer.innerHTML = '<div class="modal' + (wide ? " wide" : "") + '">' + html + "</div>";
  modalRoot.appendChild(layer);
  return layer;
}
function closeModal(){
  if (modalRoot.lastChild) modalRoot.removeChild(modalRoot.lastChild);
}
function closeAllModals(){
  modalRoot.innerHTML = "";
}
function modalHead(title){
  return '<header><h3>' + esc(title) + '</h3><button type="button" class="xbtn" data-act="m-close" aria-label="閉じる">×</button></header>';
}
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && modalRoot.children.length) closeModal();
});
modalRoot.addEventListener("click", function(e){
  if (e.target.classList && e.target.classList.contains("modalwrap")) closeModal();
});

/* 確認モーダル */
var confirmCb = null;
function openConfirm(title, msg, yesLabel, cb){
  confirmCb = cb;
  openModal(modalHead(title) + '<div class="body"><p style="margin:0;font-size:14px;line-height:1.7">' + esc(msg) + '</p></div>' +
    '<footer><button type="button" class="btn" data-act="m-close" style="flex:1">キャンセル</button>' +
    '<button type="button" class="btn danger" data-act="confirm-yes" style="flex:1">' + esc(yesLabel) + "</button></footer>");
}

  if (palDraft._isNew && palByName(name)){ if (err) err.textContent = "同名のパルがすでに収録されています"; return; }
  var rec = { dexNo: (palDraft.dexNo||"").trim(), name: name, elements: palDraft.elements.slice(),
    hp: palDraft.hp === "" || palDraft.hp == null ? null : Number(palDraft.hp),
    atk: palDraft.atk === "" || palDraft.atk == null ? null : Number(palDraft.atk),
    def: palDraft.def === "" || palDraft.def == null ? null : Number(palDraft.def),
    work: Object.assign({}, palDraft.work),
    partner: (palDraft.partner.name || "").trim() ? { name: palDraft.partner.name.trim(), desc: palDraft.partner.desc || "", tags: palDraft.partner.tags.slice(), stack: (palDraft.partner.stack || "").trim() || null } : null };
  var seedNames = SEED_PALS.map(function(p){ return p.name; });
  if (seedNames.indexOf(name) >= 0 && !palDraft.custom){ DB.palEdits[name] = rec; }

function deletePal(name){

  pasDraft = src ? { name: src.name, effect: src.effect, rarity: src.rarity || "", custom: src.custom } : { name: "", effect: "", rarity: "", custom: true };
  pasDraft._isNew = !src;
  var h = modalHead(src ? "パッシブを編集" : "パッシブを手動登録") + '<div class="body"><div style="display:flex;flex-direction:column;gap:14px">' +
    '<div><label class="lbl" for="s-name">パッシブ名（正式名称）</label><input class="inp" id="s-name" data-sf="name" aria-label="パッシブ名" value="' + esc(pasDraft.name) + '"' + (src ? " readonly" : "") + " /></div>" +
    '<div><label class="lbl" for="s-effect">効果</label><textarea class="ta" id="s-effect" data-sf="effect" rows="3" aria-label="効果">' + esc(pasDraft.effect) + "</textarea></div>" +
    '<div><label class="lbl" for="s-rarity">レアリティ（空欄＝未確認）</label><input class="inp" id="s-rarity" data-sf="rarity" aria-label="レアリティ" value="' + esc(pasDraft.rarity) + '" /></div>' +
    '<p class="small" id="pas-error" style="color:var(--danger);margin:0"></p></div></div>' +
    '<footer><button type="button" class="btn" data-act="m-close" style="flex:1">キャンセル</button><button type="button" class="btn primary" data-act="pas-save" style="flex:2">保存する</button></footer>';
  openModal(h);
}
function savePassive(){
  var err = document.getElementById("pas-error");
  var name = (pasDraft.name || "").trim();
  if (!name){ if (err) err.textContent = "パッシブ名を入力してください"; return; }
  if (pasDraft._isNew && passiveByName(name)){ if (err) err.textContent = "同名のパッシブがすでに収録されています"; return; }
  var rec = { name: name, effect: pasDraft.effect || "", rarity: (pasDraft.rarity || "").trim() || null };
  var seedNames = SEED_PASSIVES.map(function(p){ return p.name; });
  if (seedNames.indexOf(name) >= 0 && !pasDraft.custom){ DB.passiveEdits[name] = rec; }
  else {
    var i = DB.customPassives.findIndex(function(p){ return p.name === name; });
    if (i >= 0) DB.customPassives[i] = rec; else DB.customPassives.push(rec);
  }
  save(); pasDraft = null; closeAllModals(); render(); toast("パッシブを保存しました");
}
function deletePassive(name){
  openConfirm("パッシブを削除", "「" + name + "」をパッシブ図鑑から削除します。個体に設定済みの名前はそのまま残ります。", "削除する", function(){
    var i = DB.customPassives.findIndex(function(p){ return p.name === name; });
    if (i >= 0) DB.customPassives.splice(i, 1);
    else if (DB.passiveDeleted.indexOf(name) < 0) DB.passiveDeleted.push(name);
    delete DB.passiveEdits[name];
    save(); closeAllModals(); render(); toast("削除しました");
  });
}

/* ================= 拠点編集 ================= */
var baseDraft = null;
function openBaseEditor(base){
  baseDraft = base ? { id: base.id, name: base.name, memo: base.memo } : { id: null, name: "", memo: "" };
  var h = modalHead(base ? "拠点を編集" : "拠点を追加") + '<div class="body"><div style="display:flex;flex-direction:column;gap:14px">' +
    '<div><label class="lbl" for="b-name">拠点名</label><input class="inp" id="b-name" data-bf="name" aria-label="拠点名" value="' + esc(baseDraft.name) + '" /></div>' +
    '<div><label class="lbl" for="b-memo">拠点の自由メモ</label><textarea class="ta" id="b-memo" data-bf="memo" rows="3" aria-label="拠点の自由メモ">' + esc(baseDraft.memo) + "</textarea></div>" +
    '<p class="small" id="base-error" style="color:var(--danger);margin:0"></p></div></div>' +
    '<footer><button type="button" class="btn" data-act="m-close" style="flex:1">キャンセル</button><button type="button" class="btn primary" data-act="base-save" style="flex:2">保存する</button></footer>';
  openModal(h);
}

/* ================= バックアップ（旧サーバー版と互換の形式） ================= */
function palToBackup(p){
  return { dexNo: p.dexNo, name: p.name, elements: p.elements, baseHp: p.hp, baseAtk: p.atk, baseDef: p.def, work: p.work,
    partnerName: p.partner ? p.partner.name : null, partnerDesc: p.partner ? p.partner.desc : null,
    partnerTags: p.partner ? p.partner.tags : [], partnerStack: p.partner ? p.partner.stack : null };
}
function palFromBackup(x){
  return { dexNo: x.dexNo || "", name: x.name, elements: Array.isArray(x.elements) ? x.elements : [],
    hp: x.baseHp == null ? null : x.baseHp, atk: x.baseAtk == null ? null : x.baseAtk, def: x.baseDef == null ? null : x.baseDef,
    work: x.work || {}, partner: x.partnerName ? { name: x.partnerName, desc: x.partnerDesc || "", tags: x.partnerTags || [], stack: x.partnerStack || null } : null };
}
function exportJson(){
  var data = {
    app: "PAL ARCHIVE", version: BACKUP_VERSION, exportedAt: nowISO(), storage: "device-link",
    bases: DB.bases.map(function(b){ return { name: b.name, memo: b.memo }; }),
    individuals: DB.individuals.map(function(ind){
      return { palName: ind.palName, nickname: ind.nickname, level: ind.level, gender: ind.gender, condense: ind.condense,
        ivHp: ind.ivHp, ivAtk: ind.ivAtk, ivDef: ind.ivDef, favorite: ind.favorite ? 1 : 0,
        currentPassives: ind.currentPassives, targetPassives: ind.targetPassives, purposes: ind.purposes, status: ind.status,
        workCurrent: ind.workCurrent, workTarget: ind.workTarget,
        baseName: ind.baseId ? baseName(ind.baseId) : null, plannedBaseName: ind.plannedBaseId ? baseName(ind.plannedBaseId) : null,
        memo: ind.memo, priority: ind.priority };
    }),
    customPals: DB.customPals.map(palToBackup).concat(Object.keys(DB.palEdits).map(function(k){ return palToBackup(DB.palEdits[k]); })),
    customPassives: DB.customPassives.map(function(p){ return { name: p.name, effect: p.effect, rarity: p.rarity }; })
      .concat(Object.keys(DB.passiveEdits).map(function(k){ var p = DB.passiveEdits[k]; return { name: p.name, effect: p.effect, rarity: p.rarity }; })),
    deletedSeedPals: DB.palDeleted.slice(), deletedSeedPassives: DB.passiveDeleted.slice()
  };
  downloadFile("pal-archive-backup-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(data, null, 2), "application/json");
  toast("JSONバックアップを書き出しました（個体の画像は含まれません）");
}
function exportCsv(){
  var header = ["パル名","ニックネーム","レベル","性別","濃縮","才能HP","才能攻撃","才能防御","お気に入り","現在のパッシブ","目標パッシブ","不足パッシブ","運用目的","育成状況","現在の拠点","配置予定の拠点","優先度","メモ"];
  var lines = DB.individuals.map(function(ind){
    return [ind.palName, ind.nickname, ind.level, ind.gender, ind.condense,
      ind.ivHp == null ? "" : ind.ivHp, ind.ivAtk == null ? "" : ind.ivAtk, ind.ivDef == null ? "" : ind.ivDef,
      ind.favorite ? "★" : "", (ind.currentPassives||[]).join("・"), (ind.targetPassives||[]).join("・"),
      missingPassives(ind).join("・"), (ind.purposes||[]).join("・"), ind.status,
      baseName(ind.baseId), baseName(ind.plannedBaseId), ind.priority, ind.memo].map(csvEscape).join(",");
  });
  downloadFile("pal-archive-individuals-" + new Date().toISOString().slice(0, 10) + ".csv", "\uFEFF" + [header.join(",")].concat(lines).join("\n"), "text/csv");
  toast("CSVを書き出しました");
}
var pendingImport = null;
function applyImport(parsed){
  var baseIdByName = {};
  var newBases = [];
  (parsed.bases || []).forEach(function(b){
    if (!b || !b.name) return;
    if (baseIdByName[b.name]) return;
    var nb = { id: uid() + Math.floor(Math.random()*1e4), name: b.name, memo: b.memo || "" };
    newBases.push(nb); baseIdByName[b.name] = nb.id;
  });
  if (!newBases.length) newBases = defaultDB().bases, newBases.forEach(function(b){ baseIdByName[b.name] = b.id; });
  var resolveBase = function(name){
    if (!name || name === "未配置") return null;
    return baseIdByName[name] || null;
  };
  DB.bases = newBases;
  DB.individuals = (parsed.individuals || []).map(function(x){
    return { id: uid() + Math.floor(Math.random()*1e6), palName: x.palName || "", nickname: x.nickname || "",
      level: x.level || 1, gender: x.gender || "不明", condense: x.condense || 0,
      ivHp: x.ivHp == null ? null : x.ivHp, ivAtk: x.ivAtk == null ? null : x.ivAtk, ivDef: x.ivDef == null ? null : x.ivDef,
      favorite: !!x.favorite, currentPassives: x.currentPassives || [], targetPassives: x.targetPassives || [],
      purposes: x.purposes || [], status: x.status || "育成予定", workCurrent: x.workCurrent || {}, workTarget: x.workTarget || {},
      baseId: resolveBase(x.baseName), plannedBaseId: resolveBase(x.plannedBaseName),
      memo: x.memo || "", priority: x.priority || "中", image: null, createdAt: nowISO(), updatedAt: nowISO() };
  });
  (parsed.customPals || []).forEach(function(x){
    if (!x || !x.name) return;
    var rec = palFromBackup(x);
    var isSeed = SEED_PALS.some(function(p){ return p.name === rec.name; });
    if (isSeed) DB.palEdits[rec.name] = rec;
    else {
      var i = DB.customPals.findIndex(function(p){ return p.name === rec.name; });
      if (i >= 0) DB.customPals[i] = rec; else DB.customPals.push(rec);
    }
    var d = DB.palDeleted.indexOf(rec.name); if (d >= 0) DB.palDeleted.splice(d, 1);
  });
  (parsed.customPassives || []).forEach(function(x){
    if (!x || !x.name) return;
    var rec = { name: x.name, effect: x.effect || "", rarity: x.rarity || null };
    var isSeed = SEED_PASSIVES.some(function(p){ return p.name === rec.name; });
    if (isSeed) DB.passiveEdits[rec.name] = rec;
    else {
      var i = DB.customPassives.findIndex(function(p){ return p.name === rec.name; });
      if (i >= 0) DB.customPassives[i] = rec; else DB.customPassives.push(rec);
    }
    var d = DB.passiveDeleted.indexOf(rec.name); if (d >= 0) DB.passiveDeleted.splice(d, 1);
  });
  (parsed.deletedSeedPals || []).forEach(function(n){ if (DB.palDeleted.indexOf(n) < 0) DB.palDeleted.push(n); });
  (parsed.deletedSeedPassives || []).forEach(function(n){ if (DB.passiveDeleted.indexOf(n) < 0) DB.passiveDeleted.push(n); });
  save();
  tab = "plan"; saveUI(); closeAllModals(); render();
  toast("復元しました（個体" + DB.individuals.length + "件・拠点" + DB.bases.length + "件）。画像はバックアップに含まれないため復元されません");
}

/* ================= 画像アップロード ================= */
var imgTargetId = null;
function handleImageFile(file){
  if (!file || !imgTargetId) return;
  var reader = new FileReader();
  reader.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 512, scale = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      var ind = indById(imgTargetId);
      if (ind){
        ind.image = c.toDataURL("image/jpeg", 0.85);
        ind.updatedAt = nowISO();
        save(); closeAllModals(); render();
        if (storageOK) toast("画像を設定しました");
        openIndDetail(ind.id);
      }
      imgTargetId = null;
    };
    img.src = String(reader.result);
  };
  reader.readAsDataURL(file);
}

/* ================= フィルタ連動（フォーカスを保って再描画） ================= */
function setFilter(path, value){
  var parts = path.split(".");
  var obj = F[parts[0]];
  if (!obj) return;
  if (parts[1] === "work1Min") value = Number(value) || 1;
  obj[parts[1]] = value;
  saveUI();
  var ae = document.activeElement;
  var focusKey = ae && ae.getAttribute ? ae.getAttribute("data-f") : null;
  var selStart = ae && typeof ae.selectionStart === "number" ? ae.selectionStart : null;
  var sy = window.scrollY;
  render();
  window.scrollTo(0, sy);
  if (focusKey){
    var el = document.querySelector('[data-f="' + focusKey + '"]');
    if (el){ el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch(e){} }
  }
}

/* ================= イベント ================= */
document.getElementById("tabbar").addEventListener("click", function(e){
  var b = e.target.closest("[data-tab]");
  if (!b) return;
  tab = b.getAttribute("data-tab"); saveUI(); closeAllModals(); render();
});
document.getElementById("main").addEventListener("input", function(e){
  var f = e.target.getAttribute && e.target.getAttribute("data-f");
  if (f && (e.target.tagName === "INPUT")) setFilter(f, e.target.value);
});
document.getElementById("main").addEventListener("change", function(e){
  var f = e.target.getAttribute && e.target.getAttribute("data-f");
  if (f && e.target.tagName === "SELECT") setFilter(f, e.target.value);
});
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act");
  var id = el.getAttribute("data-id");
  var name = el.getAttribute("data-name");
  switch (act){
    case "m-close": closeModal(); break;
    case "confirm-yes": { var cb = confirmCb; confirmCb = null; closeModal(); if (cb) cb(); break; }
    case "ind-new": openIndEditor(null, null); break;
    case "ind-detail": openIndDetail(id); break;
    case "ind-fav": {
      e.stopPropagation();
      var ind = indById(id);
      if (ind){ ind.favorite = !ind.favorite; ind.updatedAt = nowISO(); save(); render(); if (detailIndId === id && modalRoot.children.length){ closeAllModals(); openIndDetail(id); } }
      break; }
    case "ind-favfilter": F.ind.fav = !F.ind.fav; saveUI(); render(); break;
    case "ind-edit": closeAllModals(); openIndEditor(indById(id), null); break;
    case "ind-dup": {
      var src = indById(id);
      if (src){ var cp = JSON.parse(JSON.stringify(src)); cp.id = uid(); cp.createdAt = nowISO(); cp.updatedAt = nowISO(); DB.individuals.push(cp); save(); closeAllModals(); render(); toast("複製しました"); }
      break; }
    case "ind-del": {
      var target = indById(id);
      openConfirm("個体を削除", "「" + (target ? target.palName : "") + "」の個体を削除します。元に戻せません。", "削除する", function(){
        DB.individuals = DB.individuals.filter(function(x){ return x.id !== id; });
        save(); closeAllModals(); render(); toast("削除しました");
      });
      break; }
    case "ind-img": imgTargetId = id; document.getElementById("imgInput").click(); break;
    case "ind-img-del": { var ii = indById(id); if (ii){ ii.image = null; ii.updatedAt = nowISO(); save(); closeAllModals(); render(); openIndDetail(id); } break; }
    case "ind-save": saveDraft(); break;
    case "pal-pick": openPalPicker(); break;
    case "pal-pick-sel": {
      draft.palName = name;
      var p = palByName(name);
      if (p && !Object.keys(draft.workCurrent).length) draft.workCurrent = Object.assign({}, p.work);
      if (p && !Object.keys(draft.workTarget).length) draft.workTarget = Object.assign({}, p.work);
      draftOverride = draft;
      closeAllModals();
      openIndEditor(null, null);
      break; }
    case "dp-toggle": {
      var kind = el.getAttribute("data-kind");
      var arr = draft[kind];
      var ix = arr.indexOf(name);
      if (ix >= 0) arr.splice(ix, 1);
      else if (arr.length < 4) arr.push(name);
      else { toast("パッシブは4つまでです"); break; }
      refreshDraftPassives();
      break; }
    case "dp-remove": {
      var k2 = el.getAttribute("data-kind");
      draft[k2] = draft[k2].filter(function(x){ return x !== name; });
      refreshDraftPassives();
      break; }
    case "dp-purpose": {
      var ix2 = draft.purposes.indexOf(name);
      if (ix2 >= 0) draft.purposes.splice(ix2, 1); else draft.purposes.push(name);
      el.classList.toggle("on");
      break; }
    case "dex-detail": openPalDetail(name); break;
    case "reg-pal": closeAllModals(); tab = "inds"; saveUI(); render(); openIndEditor(null, name); break;
    case "pal-new": openPalEditor(null); break;
    case "pal-edit": openPalEditor(name); break;
    case "pal-del": deletePal(name); break;
    case "pal-save": savePal(); break;
    case "pe-element": {
      var ix3 = palDraft.elements.indexOf(name);
      if (ix3 >= 0) palDraft.elements.splice(ix3, 1); else palDraft.elements.push(name);
      el.classList.toggle("on");
      break; }
    case "pe-tag": {
      var ix4 = palDraft.partner.tags.indexOf(name);
      if (ix4 >= 0) palDraft.partner.tags.splice(ix4, 1); else palDraft.partner.tags.push(name);
      el.classList.toggle("on");
      break; }
    case "pas-new": openPassiveEditor(null); break;
    case "pas-detail": openPassiveDetail(name); break;
    case "pas-edit": openPassiveEditor(name); break;
    case "pas-del": deletePassive(name); break;
    case "pas-save": savePassive(); break;
    case "pas-cat": {
      var cat = el.getAttribute("data-cat");
      var ix5 = F.pas.cats.indexOf(cat);
      if (ix5 >= 0) F.pas.cats.splice(ix5, 1); else F.pas.cats.push(cat);
      saveUI(); render();
      break; }
    case "par-tag": F.par.tag = el.getAttribute("data-tag"); saveUI(); render(); break;
    case "par-detail": openPalDetail(name); break;
    case "base-new": openBaseEditor(null); break;
    case "base-edit": openBaseEditor(baseById(id)); break;
    case "base-del": {
      var b = baseById(id);
      openConfirm("拠点を削除", "拠点「" + (b ? b.name : "") + "」を削除します。配置中の個体は未配置になります。", "削除する", function(){
        DB.bases = DB.bases.filter(function(x){ return x.id !== id; });
        DB.individuals.forEach(function(x){ if (x.baseId === id) x.baseId = null; if (x.plannedBaseId === id) x.plannedBaseId = null; });
        save(); closeAllModals(); render(); toast("拠点を削除しました");
      });
      break; }
    case "base-save": {
      var berr = document.getElementById("base-error");
      if (!baseDraft.name.trim()){ if (berr) berr.textContent = "拠点名を入力してください"; break; }
      if (baseDraft.id){ var bb = baseById(baseDraft.id); if (bb){ bb.name = baseDraft.name.trim(); bb.memo = baseDraft.memo; } }
      else DB.bases.push({ id: uid(), name: baseDraft.name.trim(), memo: baseDraft.memo });
      save(); baseDraft = null; closeAllModals(); render(); toast("拠点を保存しました");
      break; }
    case "export-json": exportJson(); break;
    case "export-csv": exportCsv(); break;
    case "import-json": document.getElementById("fileInput").click(); break;
  }
});
/* キーボード：カードの Enter 操作 */
document.addEventListener("keydown", function(e){
  if (e.key === "Enter" && e.target && e.target.getAttribute && e.target.getAttribute("data-act") && e.target.tagName === "DIV"){
    e.target.click();
  }
});
/* モーダル内の入力連動 */
modalRoot.addEventListener("input", function(e){
  var t = e.target;
  if (t.id === "palpick-q"){ renderPalPickList(t.value.trim()); return; }
  if (t.id === "pq-currentPassives"){ renderPickerList("currentPassives"); return; }
  if (t.id === "pq-targetPassives"){ renderPickerList("targetPassives"); return; }
  var df = t.getAttribute && t.getAttribute("data-df");
  if (df && draft){
    if (df === "favorite") draft.favorite = t.checked;
    else if (df === "level" || df === "condense") draft[df] = t.value === "" ? "" : Number(t.value);
    else draft[df] = t.value;
    return;
  }
  var pf = t.getAttribute && t.getAttribute("data-pf");
  if (pf && palDraft){
    if (pf === "partnerName") palDraft.partner.name = t.value;
    else if (pf === "partnerDesc") palDraft.partner.desc = t.value;
    else if (pf === "partnerStack") palDraft.partner.stack = t.value;
    else palDraft[pf] = t.value;
    return;
  }
  var sf = t.getAttribute && t.getAttribute("data-sf");
  if (sf && pasDraft){ pasDraft[sf] = t.value; return; }
  var bf = t.getAttribute && t.getAttribute("data-bf");
  if (bf && baseDraft){ baseDraft[bf] = t.value; return; }
});
modalRoot.addEventListener("change", function(e){
  var t = e.target;
  if (t.id === "palpick-sort"){ palPickSort = t.value; renderPalPickList(); return; }
  var df = t.getAttribute && t.getAttribute("data-df");
  if (df && draft){
    if (df === "favorite") draft.favorite = t.checked;
    else if (df === "condense") draft.condense = Number(t.value);
    else draft[df] = t.value;
  }
  var dw = t.getAttribute && t.getAttribute("data-dw");
  if (dw && draft){
    var w = t.getAttribute("data-work"), v = Number(t.value);
    if (v <= 0) delete draft[dw][w]; else draft[dw][w] = v;
  }
  var pw = t.getAttribute && t.getAttribute("data-pw");
  if (pw && palDraft){
    var v2 = Number(t.value);
    if (v2 <= 0) delete palDraft.work[pw]; else palDraft.work[pw] = v2;
  }
});
/* ファイル入力 */
document.getElementById("imgInput").addEventListener("change", function(e){
  handleImageFile(e.target.files[0]);
  e.target.value = "";
});
document.getElementById("fileInput").addEventListener("change", function(e){
  var file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  file.text().then(function(text){
    var parsed;
    try { parsed = JSON.parse(text); } catch(err){ toast("JSONを読み取れませんでした"); return; }
    if (!parsed || typeof parsed.version !== "number" || !Array.isArray(parsed.individuals)){
      toast("PAL ARCHIVEのバックアップ形式ではありません");
      return;
    }
    pendingImport = parsed;
    openConfirm("バックアップを復元",
      "現在の拠点（" + (parsed.bases ? parsed.bases.length : 0) + "件）と個体（" + parsed.individuals.length + "件）で置き換えます。よろしいですか？",
      "復元する", function(){ var p = pendingImport; pendingImport = null; applyImport(p); });
  }).catch(function(){ toast("ファイルの読み込みに失敗しました"); });
});

/* ================= 初期化 ================= */
showStoreBadge();
try { localStorage.setItem("pal-archive-link:probe", "1"); localStorage.removeItem("pal-archive-link:probe"); }
catch(e){ storageOK = false; showStoreBadge(); }
render();
